<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" type="text/css" href="change-password-styles.css" />

    <script
      src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"
      defer
    ></script>
    <script src="validate-change-password.js" defer></script>

    <title>Reset Password</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  </head>

  <body>
    <section class="vh-100" style="background-color: #f9f6ef">
      <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card shadow-2-strong" style="border-radius: 1rem">
              <div class="card-body p-5">
                <form
                  action="process-reset-password.php"
                  id="change-password-form"
                  method="post"
                >
                  <h1 class="mb-5">Change Password</h1>

                  <div class="form-outline mb-2">
                    <label class="form-label" for="old-password"
                      >Old Password</label
                    >
                    <input
                      type="password"
                      id="old-password"
                      class="form-control form-control"
                      name="old-password"
                      required
                    />
                  </div>

                  <div class="form-outline mb-2">
                    <label class="form-label" for="password"
                      >New Password</label
                    >
                    <input
                      type="password"
                      id="new-password"
                      class="form-control form-control"
                      name="new-password"
                      required
                    />
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="password"
                      >Confirm New Password</label
                    >
                    <input
                      type="password"
                      id="new-password-confirmation"
                      class="form-control form-control"
                      name="new-password-confirmation"
                      required
                    />
                  </div>

                  <button
                    class="btn btn-block text-white w-100"
                    style="background-color: #8c1515"
                    type="submit"
                  >
                    Change Password
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
