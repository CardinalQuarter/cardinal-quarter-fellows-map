name: Build and deploy to GitHub Pages

on:
  workflow_dispatch: # Manual deploy only: Actions → Run workflow

permissions:
  contents: write # commits the data snapshot, geocode cache, and logos back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build site
        id: build
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # Project page lives at https://<org>.github.io/<repo>/ until a custom
          # domain is attached; then set the BASE_PATH repo variable to "/".
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run build
      - name: Upload full build report
        # The run summary shows only the first 50 entries of each list.
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
          if-no-files-found: ignore
      - name: Commit data snapshot
        # Every published change to the data is a readable diff in git history.
        # The snapshot is a nice-to-have: if the push cannot land (a re-run of
        # an old attempt, a commit racing the build), the deploy still proceeds.
        # A failed or cancelled build still commits its geocode/logo caches
        # (saved every 30 s), so the next run resumes instead of starting over;
        # public/data is committed only from a successful build.
        if: always() && steps.build.outcome != 'skipped'
        continue-on-error: true
        run: |
          if [ "${{ steps.build.outcome }}" = success ]; then
            paths="public/data public/logos data/geocache.json data/logocache.json"
            message="Data snapshot $(date -u +%Y-%m-%d)"
          else
            paths="public/logos data/geocache.json data/logocache.json"
            message="Cache checkpoint from unfinished build $(date -u +%Y-%m-%d)"
          fi
          git add $paths
          if git diff --cached --quiet; then
            echo "Data unchanged"
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "$message"
          for attempt in 1 2 3; do
            git fetch origin ${{ github.ref_name }}
            # Already on the branch (e.g. a re-run of an attempt that pushed)?
            if git diff --quiet HEAD origin/${{ github.ref_name }} -- $paths; then
              echo "Snapshot already on ${{ github.ref_name }}; nothing to push"
              exit 0
            fi
            git rebase origin/${{ github.ref_name }} || { git rebase --abort; exit 1; }
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "Push rejected (attempt $attempt), retrying"
            sleep 5
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
